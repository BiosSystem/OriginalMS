name: Build

# The release workflow only runs on tags, so a pom change could reach main
# without ever being compiled. This builds every pull request and every push
# to main the same way the release job does, and nothing else: no packages,
# no releases, read-only token.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Compile (Maven, JDK 8)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Java 8
        uses: actions/setup-java@v5
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'maven'

      # Same invocation as release_and_packages.yml, so a green build here
      # means the tag build will compile too.
      - name: Compile (Maven)
        run: mvn -B clean package -DskipTests

      - name: Step Summary
        if: always()
        run: |
          echo "### Build Status" >> $GITHUB_STEP_SUMMARY
          echo "- Maven Compile: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- JDK: Temurin 8" >> $GITHUB_STEP_SUMMARY
